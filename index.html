<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url(mountain.view.jpg);
            background-size: cover;
            text-align: center;
            margin-top: 250px;
        }
        h1{
            font-size: 75px;
        }
        p{
            font-size: 40px;
        }
        .content{
            background-color: rgba(248, 248, 248,.2);
        }
        @media screen and (orientation: portrait){
            body{
                height: 100vh;
                background-size: 100vh 100vh;
                background-repeat: no-repeat;
            }
            h1{
                font-size: xx-large;
            }
            p{
                font-size: medium;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Mountain View</h1>
        <p>A Beautiful Senery With High Peaks of Mountains </p>
    </div>
</body>
</html>
